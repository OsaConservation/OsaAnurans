[project]
name = "osa-anurans-app"
version = "0.1.0"
description = "Local-first frog annotation and Perch embedding workflow"
requires-python = ">=3.11,<3.12"
dependencies = [
    "bacpipe==1.3.5",
    "numpy==1.26.4",
    "torch==2.6.0",
    "soundfile>=0.12",
    "scikit-learn>=1.7,<2",
    "tqdm>=4.67",
    "onnxruntime>=1.23,<2",
    "google-cloud-bigquery>=3.30,<4",
    "google-cloud-storage>=3,<4",
    "google-auth>=2,<3",
    "questionary>=2.1,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.uv]
# Later releases have no Windows wheels; TensorFlow 2.15 accepts this version.
override-dependencies = ["tensorflow-io-gcs-filesystem==0.31.0; sys_platform == 'win32'"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
